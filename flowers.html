:root{--bg:#121014;--panel:#1d1a20;--line:#322d37;--text:#f3ede7;--muted:#a69fab;--acc:#e5486a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:12px 16px 24px;display:flex;justify-content:center}
.app{width:100%;max-width:1240px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:400 28px 'FL',cursive;margin:0;letter-spacing:.3px}
.tip{color:var(--muted);font-size:13px}
.stage{position:relative;width:100%;max-width:max(560px,calc((100vh - 260px)*16/9));margin:0 auto;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55);background:#000;cursor:text}
canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.badge{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:99px;background:rgba(200,20,40,.9);color:#fff;font-size:13px;font-weight:600;display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#txt{flex:1 1 260px;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 16px;font-size:18px;outline:none}
#txt:focus{border-color:#6b6372}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:820px){.themes{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}}
.chip{display:flex;align-items:center;gap:9px;height:46px;padding:0 12px 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;text-align:left}
.chip i{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.chip.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.lbl{color:var(--muted);font-size:14px;margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{height:44px;min-width:54px;padding:0 12px;background:var(--panel);color:var(--muted);border:0;font-size:15px;cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;cursor:pointer}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;margin-left:auto;min-width:180px}
button:disabled,input:disabled{opacity:.5;cursor:default}
.msg{color:var(--muted);font-size:14px;min-height:20px}
.msg a{color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <header><h1>Цветочные буквы</h1><span class="tip">Нажми на картинку и печатай</span></header>
  <div class="stage" id="stage">
    <canvas id="c" width="1920" height="1080"></canvas>
    <div class="hint" id="hint">Нажми и напиши своё слово</div>
    <div class="badge" id="badge">● Запись</div>
  </div>
  <div class="row">
    <input id="txt" maxlength="32" placeholder="Напиши слово или фразу" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
  </div>
  <div class="themes" id="themes"></div>
  <div class="row">
    <span class="lbl">Длительность</span>
    <div class="seg" id="dur"><button data-d="5">5 с</button><button data-d="10" class="on">10 с</button><button data-d="15">15 с</button></div>
    <button class="btn" id="again">Заново</button>
    <button class="btn" id="clear">Очистить</button>
    <button class="btn main" id="dl">Скачать видео</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(()=>{
'use strict';
const W=1920,H=1080,REF=200,FONT='200px FL, "Segoe Script", cursive',TAU=Math.PI*2,INKC='#141414',PAPER='#f3eee3';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3);
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const HX={};
function hex(c){if(HX[c])return HX[c];let s=c.replace('#','');if(s.length===3)s=s.split('').map(x=>x+x).join('');const n=parseInt(s,16);return HX[c]=[n>>16&255,n>>8&255,n&255]}
function mix(a,b,k){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function rgba(c,a){const A=hex(c);return`rgba(${A[0]},${A[1]},${A[2]},${a})`}
function lin(c,stops,x0=0,y0=0,x1=0,y1=H){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g}
function rad(c,x,y,r,stops){const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g}

/* ---------- фоны ---------- */
function vignette(c,a){c.fillStyle=rad(c,W/2,H/2,W*.72,['rgba(0,0,0,0)','rgba(0,0,0,0)',`rgba(0,0,0,${a})`]);c.fillRect(0,0,W,H)}
function bokeh(c,R,n,cols,r0,r1,a){for(let i=0;i<n;i++){const x=R()*W,y=R()*H,r=r0+R()*(r1-r0),col=cols[i%cols.length];c.fillStyle=rad(c,x,y,r,[rgba(col,a),rgba(col,a*.5),rgba(col,0)]);c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}}

 const vis=(x,y,id,s)=>{const i=ci(x,y),o=own[i];return o!==-1&&(o!==id||s-stp[i]>5)};
 const mark=(x,y,id,s)=>{const i=ci(x,y);if(own[i]===-1){own[i]=id;stp[i]=s}};
 const cells=[];for(let y=0;y<mh;y++)for(let x=0;x<mw;x++)if(mask[y*mw+x])cells.push([x*G+2-L.ox,y*G+2-L.oy]);
 L.vines=[];if(!cells.length)return;
 const nV=clamp(Math.round(cells.length/240),3,5);
 for(let v=0,tries=0;v<nV&&tries<60;tries++){
  const c0=cells[(R()*cells.length)|0];let x=c0[0],y=c0[1];if(vis(x,y,v,0))continue;
  let h=0,best=-1;for(let a=0;a<14;a++){const an=a/14*TAU+R()*.3;let l=0;while(l<14&&ink(x+Math.cos(an)*l*STEP,y+Math.sin(an)*l*STEP))l++;if(l>best){best=l;h=an}}
  const xs=[x],ys=[y];mark(x,y,v,0);
  for(let s=1;s<130;s++){let ok=false;const sg=R()<.5?1:-1;
   for(let pass=0;pass<2&&!ok;pass++)for(const d of DEL){const a=h+d*sg+(R()-.5)*.14,cx=Math.cos(a),sy=Math.sin(a),nx=x+cx*STEP,ny=y+sy*STEP;
    if(!ink(nx,ny)||!ink(nx+cx*STEP,ny+sy*STEP))continue;
    if(pass===0&&!(ink(nx-sy*6,ny+cx*6)&&ink(nx+sy*6,ny-cx*6)))continue;
    if(vis(nx,ny,v,s))continue;x=nx;y=ny;h=a;ok=true;break}
   if(!ok)break;xs.push(x);ys.push(y);mark(x,y,v,s)}
  if(xs.length<9)continue;
  const ie=xs.length,dir=R()<.5?1:-1;let st=4.2;const nt=12+R()*12;for(let j=0;j<nt;j++){h+=dir*(.09+j*.022);x+=Math.cos(h)*st;y+=Math.sin(h)*st;st*=.97;xs.push(x);ys.push(y)}
  L.vines.push(buildVine(xs,ys,ie,R));v++}
}
function buildVine(xs,ys,ie,R){
 const n=xs.length,ang=i=>{const a=Math.max(0,i-1),b=Math.min(n-1,i+1);return Math.atan2(ys[b]-ys[a],xs[b]-xs[a])};
 const leaves=[];let side=R()<.5?1:-1;
 for(let i=3;i<n-3;i+=(i<ie?5:6)+((R()*3)|0)){side=-side;const k=i<ie?1:.6;leaves.push({i,a:ang(i)+side*(.55+R()*.5),len:(13+R()*11)*k,ph:R()*TAU,c:(R()*4)|0})}
 const fl=(i,k)=>({i,s:(18+R()*16)*k,rot:R()*TAU,r:R(),r2:R(),d:(R()-.5)*8,a:ang(i)});
 const flowers=[fl(Math.max(2,ie-1),1.05)];
 for(let i=9;i<ie-7;i+=16+((R()*14)|0))flowers.push(fl(i,.8+R()*.25));
 if(R()<.65)flowers.push(fl(n-1,.45));
 flowers.sort((p,q)=>q.s-p.s);
 return{xs:Float32Array.from(xs),ys:Float32Array.from(ys),n,ie,leaves,flowers,w0:3.6+R()*1.4}}
function tint(L){const c=document.createElement('canvas');c.width=L.gw;c.height=L.gh;const g=c.getContext('2d');g.font=FONT;
 g.fillStyle=typeof TH.letter==='function'?TH.letter(g,L):TH.letter;
 if(TH.glow){g.shadowColor=TH.glow;g.shadowBlur=TH.glowB||22}
 g.fillText(L.ch,L.ox,L.oy);if(TH.glow){g.shadowBlur=0;g.fillText(L.ch,L.ox,L.oy)}
 L.tint=c;L.tintFor=THI}

/* ---------- раскладка ---------- */
function layout(){
 const s=curText,words=[];let m;const re=/\S+/g;while((m=re.exec(s)))words.push({t:m[0],i:m.index});
 if(!words.length)return;
 mc.font=FONT;const sp=mc.measureText(' ').width,ww=w=>mc.measureText(w).width;let lines=[],f;
 for(f=340;f>=70;f-=10){const k=f/REF,maxw=1700/k;lines=[];let cur=null;
  for(const w of words){const wd=ww(w.t);if(cur&&cur.w+sp+wd<=maxw){cur.items.push([w,cur.w+sp]);cur.w+=sp+wd}else{cur={items:[[w,0]],w:wd};lines.push(cur)}}
  if(lines.every(l=>l.w<=maxw)&&lines.length*f*1.34<=900)break}
 f=Math.max(f,70);const k=f/REF,byIdx={};letters.forEach(L=>byIdx[L.idx]=L);
 lines.forEach((l,li)=>{const x0=W/2-l.w*k/2,y=H/2+(li-(lines.length-1)/2)*f*1.34+f*.3;
  for(const[w,off]of l.items)for(let j=0;j<w.t.length;j++){const L=byIdx[w.i+j];if(!L)continue;L.tx=x0+(off+mc.measureText(w.t.slice(0,j)).width)*k;L.ty=y;L.tsc=k;if(L.fresh){L.x=L.tx;L.y=L.ty;L.sc=k;L.fresh=false}}})}
function setText(s){
 s=s.replace(/\s+/g,' ');const old=curText;let p=0;while(p<old.length&&p<s.length&&old[p]===s[p])p++;
 const hadAny=letters.length>0;letters=letters.filter(L=>L.idx<p);let k=0;
 for(let i=p;i<s.length;i++)if(s[i]!==' '){const L=createLetter(s[i],i);L.start=T+k*.12;k++;letters.push(L)}
 if(!hadAny&&letters.length)resetScene();
 curText=s;layout();updateUI()}
function resetScene(){sceneStart=T;makeButterflies()}
function schedule(){
 const n=letters.length;if(!n)return;const sp=n>1?Math.min(.5,D*.3/(n-1)):0,last=(n-1)*sp,wr=Math.min(.85,.4+sp*1.2);
 const bl=D<=5?1:1.4,gd=clamp(D*.9-.5-last-wr*.35-bl,1.4,4.5);
 letters.sort((a,b)=>a.idx-b.idx).forEach((L,i)=>{L.start=T+.35+i*sp;L.wr=wr;L.gd=gd;L.bl=bl})}
function regen(){sceneSeed=(Math.random()*1e9)|0;letters=letters.map(L=>{const N=createLetter(L.ch,L.idx);N.x=L.x;N.y=L.y;N.sc=L.sc;N.tx=L.tx;N.ty=L.ty;N.tsc=L.tsc;N.fresh=false;return N});resetScene();schedule()}

/* ---------- бабочки и частицы ---------- */
let BFS=[];
function makeButterflies(){const R=rng(sceneSeed^0x5bd1e995);BFS=[];for(let k=0;k<5;k++)BFS.push({born:sceneStart+.9+k*1.1,ax:620+R()*200,bx:80+R()*90,ay:300+R()*90,by:50+R()*60,fx:.16+R()*.14,gx:.4+R()*.3,fy:.22+R()*.16,gy:.5+R()*.3,px:R()*TAU,qx:R()*TAU,py:R()*TAU,qy:R()*TAU,size:28+R()*16,fr:9+R()*4,ph:R()*TAU,ci:k,dir:R()<.5?1:-1})}
function bfPos(b,t){t*=b.dir;return[W/2+b.ax*Math.sin(b.fx*t+b.px)+b.bx*Math.sin(b.gx*t+b.qx),H/2+b.ay*Math.sin(b.fy*t+b.py)+b.by*Math.cos(b.gy*t+b.qy)]}
function wing(c,s,C,upper){c.beginPath();if(upper){c.moveTo(0,0);c.bezierCurveTo(s*.2,-s*1.15,s*1.35,-s*1.15,s*1.15,-s*.2);c.bezierCurveTo(s*1.0,s*.15,s*.4,s*.12,0,0)}else{c.moveTo(0,0);c.bezierCurveTo(s*.75,s*.02,s*.95,s*.85,s*.48,s*.85);c.bezierCurveTo(s*.15,s*.8,0,s*.4,0,0)}
 if(TH.ink){c.fillStyle=PAPER;c.fill();c.strokeStyle=INKC;c.lineWidth=2;c.stroke();c.beginPath();c.moveTo(0,0);c.lineTo(upper?s*.9:s*.4,upper?-s*.6:s*.6);c.moveTo(0,0);c.lineTo(upper?s*.6:s*.6,upper?-s*.8:s*.4);c.lineWidth=1;c.stroke();return}
 const g=c.createLinearGradient(0,0,s*1.2,0);g.addColorStop(0,C[1]);g.addColorStop(.45,C[0]);g.addColorStop(1,C[0]);c.fillStyle=g;c.fill();c.strokeStyle=C[1];c.lineWidth=s*.07;c.stroke();
 dot(c,upper?s*.95:s*.5,upper?-s*.45:s*.62,s*.07,'rgba(255,255,255,.85)');if(upper)dot(c,s*.72,-s*.72,s*.05,'rgba(255,255,255,.75)')}
function drawBF(c,b){const tt=T-b.born;if(tt<0)return;const app=ease(tt/1.2),t=tt+b.ph*3,p=bfPos(b,t),p2=bfPos(b,t+.03);
 const h=Math.atan2(p2[1]-p[1],p2[0]-p[0])+Math.PI/2,ca=Math.cos(h),sa=Math.sin(h),s=b.size*app,C=TH.bf[b.ci%TH.bf.length];
 const fl=.16+.84*Math.abs(Math.sin(T*b.fr+b.ph));
 if(TH.glowBf){c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='lighter';c.globalAlpha=.6*app;c.drawImage(sprite(C[0]),p[0]-s*2,p[1]-s*2,s*4,s*4);c.globalAlpha=1;c.globalCompositeOperation='source-over'}
 for(const sd of[1,-1]){c.setTransform(ca*sd*fl,sa*sd*fl,-sa,ca,p[0],p[1]);wing(c,s*.8,C,false);wing(c,s,C,true)}
 c.setTransform(ca,sa,-sa,ca,p[0],p[1]);const bc=TH.ink?INKC:mix(C[1],'#000000',.4);c.fillStyle=bc;c.beginPath();c.ellipse(0,0,s*.08,s*.5,0,0,TAU);c.fill();
 c.strokeStyle=bc;c.lineWidth=1.5;c.beginPath();c.moveTo(0,-s*.45);c.quadraticCurveTo(s*.1,-s*.8,s*.28,-s*.9);c.moveTo(0,-s*.45);c.quadraticCurveTo(-s*.1,-s*.8,-s*.28,-s*.9);c.stroke()}
const SPR={};function sprite(col){if(SPR[col])return SPR[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle=rad(g,32,32,32,[rgba(col,1),rgba(col,.35),rgba(col,0)]);g.fillRect(0,0,64,64);return SPR[col]=c}
const PR=rng(99),PTS=Array.from({length:50},()=>({x:PR(),y:PR(),v:PR(),ph:PR()*TAU,s:PR()}));
function drawFX(c){const fx=TH.fx;if(fx==='none')return;c.setTransform(1,0,0,1,0,0);const cols=TH.fxc;
 PTS.forEach((p,i)=>{const col=cols[i%cols.length];
  if(fx==='petals'){if(i>=30)return;const x=((p.x*W+T*(25+40*p.v)+40*Math.sin(T*.7+p.ph))%(W+80)+W+80)%(W+80)-40,y=((p.y*H+T*(35+45*p.v))%(H+80))-40,sz=6+p.s*7;c.setTransform(Math.cos(T*p.v*2+p.ph),Math.sin(T*p.v*2+p.ph),-Math.sin(T*p.v*2+p.ph)*Math.abs(Math.sin(T*1.3+p.ph)),Math.cos(T*p.v*2+p.ph)*Math.abs(Math.sin(T*1.3+p.ph)),x,y);c.fillStyle=rgba(col,.85);c.beginPath();c.ellipse(0,0,sz,sz*.6,0,0,TAU);c.fill()}
  else if(fx==='fireflies'||fx==='dust'){const x=p.x*W+70*Math.sin(T*.3*(1+p.v)+p.ph),y=p.y*H+45*Math.cos(T*.25*(1+p.v)+p.ph*2),a=.5+.5*Math.sin(T*2.2*(.5+p.v)+p.ph),r=fx==='dust'?6+p.s*8:12+p.s*14;c.globalCompositeOperation='lighter';c.globalAlpha=a*(fx==='dust'?.7:.9);c.drawImage(sprite(col),x-r,y-r,r*2,r*2);c.globalAlpha=1;c.globalCompositeOperation='source-over'}
  else if(fx==='pollen'){if(i>=36)return;const x=p.x*W+30*Math.sin(T*.5+p.ph),y=((p.y*H-T*(12+20*p.v))%H+H)%H;c.fillStyle=rgba(col,.35+.4*Math.abs(Math.sin(T+p.ph)));c.beginPath();c.arc(x,y,2+p.s*3,0,TAU);c.fill()}})}

/* ---------- отрисовка ---------- */
const tmp=document.createElement('canvas'),tg=tmp.getContext('2d');
function setM(L,px,py,r,k){const a=Math.cos(r)*L.sc*k,b=Math.sin(r)*L.sc*k;ctx.setTransform(a,b,-b,a,L.x+px*L.sc,L.y+py*L.sc)}
function drawGlyph(L,w){if(L.tintFor!==THI)tint(L);ctx.setTransform(L.sc,0,0,L.sc,L.x,L.y);
 if(w>=1){ctx.drawImage(L.tint,-L.ox,-L.oy);return}
 if(tmp.width<L.gw||tmp.height<L.gh){tmp.width=Math.max(tmp.width,L.gw);tmp.height=Math.max(tmp.height,L.gh)}
 tg.globalCompositeOperation='source-over';tg.clearRect(0,0,tmp.width,tmp.height);tg.drawImage(L.tint,0,0);
 const soft=40,e=-soft+w*(L.gw+soft*2);tg.globalCompositeOperation='destination-in';tg.fillStyle=lin(tg,['#000','rgba(0,0,0,0)'],e-soft,0,e,soft*.4);tg.fillRect(0,0,L.gw,L.gh);
 ctx.drawImage(tmp,0,0,L.gw,L.gh,-L.ox,-L.oy,L.gw,L.gh)}
function vineHead(L,k,tl){return clamp((tl-L.wr*.35-k*.18)/L.gd)}
function drawVine(L,v,u){const hd=u*(v.n-1);if(hd<=0)return;const last=Math.floor(hd),fr=hd-last,xs=v.xs,ys=v.ys,CH=6;
 ctx.setTransform(L.sc,0,0,L.sc,L.x,L.y);ctx.lineCap='round';ctx.lineJoin='round';
 for(let pass=0;pass<2;pass++){if(pass===0&&TH.ink)continue;ctx.strokeStyle=pass?TH.vine[0]:TH.vine[1];let s=0;
  for(;;){const e=Math.min(s+CH,last);ctx.beginPath();ctx.moveTo(xs[s],ys[s]);for(let i=s+1;i<=e;i++)ctx.lineTo(xs[i],ys[i]);
   if(e===last&&last<v.n-1&&fr>0)ctx.lineTo(xs[last]+(xs[last+1]-xs[last])*fr,ys[last]+(ys[last+1]-ys[last])*fr);
   const mid=(s+e)/2;let w=v.w0*(1-.6*mid/(v.n-1))*clamp((hd-mid)/7,.35,1);if(mid>v.ie)w*=.6;if(TH.ink)w*=.6;
   ctx.lineWidth=pass?w:w+2;ctx.stroke();if(e>=last)break;s=e}}
 for(const lf of v.leaves){if(lf.i>hd)continue;const age=(hd-lf.i)/(v.n-1)*L.gd,k=ease(age/.7);if(k<=0)continue;
  setM(L,xs[lf.i],ys[lf.i],lf.a+Math.sin(T*1.5+lf.ph)*.08,k);leafShape(ctx,lf.len);fs(ctx,TH._leaf[lf.c]);
  if(!TH.ink){ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(lf.len*.85,0);ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(lf.len*.85,0);ctx.stroke()}}}
function drawFlowers(L,v,u){const hd=u*(v.n-1);
 for(const f of v.flowers){if(f.i>hd)continue;const age=(hd-f.i)/(v.n-1)*L.gd,b=clamp(age/L.bl);if(b<=0)continue;
  const e=pickF(f),s=f.s*(e.s||1),pa=f.a+Math.PI/2;
  const rot=(e.k==='lavender'?(f.r2-.5)*1.1:f.rot)+Math.sin(T*1.2+f.r*9)*.06,br=1+Math.sin(T*1.7+f.r2*9)*.025;
  setM(L,v.xs[f.i]+Math.cos(pa)*f.d,v.ys[f.i]+Math.sin(pa)*f.d,rot,br);
  if(NOBUD[e.k])PAINT[e.k](ctx,s,ease(b),e.c);else if(b<.3)bud(ctx,s,b/.3,e.c);else PAINT[e.k](ctx,s,ease((b-.3)/.7),e.c)}}
function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(bgC,0,0);
 const vis=letters.filter(L=>T-L.start>=0);
 for(const L of vis)drawGlyph(L,ease((T-L.start)/L.wr));
 for(const L of vis){const tl=T-L.start;L.vines.forEach((v,k)=>drawVine(L,v,vineHead(L,k,tl)))}
 for(const L of vis){const tl=T-L.start;L.vines.forEach((v,k)=>drawFlowers(L,v,vineHead(L,k,tl)))}
 drawFX(ctx);for(const b of BFS)drawBF(ctx,b);ctx.setTransform(1,0,0,1,0,0)}

/* ---------- темы ---------- */
function setTheme(i){THI=i;TH=THEMES[i];TH._leaf=[0,.33,.66,1].map(k=>mix(TH.leaf[0],TH.leaf[1],k));TH._fw=TH.flowers.reduce((a,e)=>a+e.w,0);
 const g=bgC.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;TH.bg(g,rng(777+i));
 document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',j===i))}
const themesEl=$('themes');
THEMES.forEach((t,i)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.innerHTML=`<i style="background:${t.sw}"></i><span>${i+1}. ${t.name}</span>`;b.onclick=()=>{if(!recording)setTheme(i)};themesEl.appendChild(b)});

/* ---------- запись видео ---------- */
let recording=false,rec=null,recEnd=0,lastURL=null;
function pickMime(){if(!window.MediaRecorder)return null;for(const m of['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}return''}
function startRecording(){
 if(recording||!letters.length)return;const mime=pickMime();
 if(mime===null||!cv.captureStream){msg('Этот браузер не умеет записывать видео. Открой страницу в Chrome.');return}
 let stream;try{stream=cv.captureStream(30)}catch(e){msg('Не удалось начать запись: '+e.message);return}
 const opts={videoBitsPerSecond:12e6};if(mime)opts.mimeType=mime;
 try{rec=new MediaRecorder(stream,opts)}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){msg('Не удалось начать запись: '+e2.message);return}}
 const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const type=(rec.mimeType||mime||'video/webm').split(';')[0],ext=type.includes('mp4')?'mp4':'webm';
  const blob=new Blob(chunks,{type});if(lastURL)URL.revokeObjectURL(lastURL);lastURL=URL.createObjectURL(blob);
  const d=new Date(),pd=x=>String(x).padStart(2,'0'),name=`flower-letters-${d.getFullYear()}${pd(d.getMonth()+1)}${pd(d.getDate())}-${pd(d.getHours())}${pd(d.getMinutes())}${pd(d.getSeconds())}.${ext}`;
  const a=document.createElement('a');a.href=lastURL;a.download=name;document.body.appendChild(a);a.click();a.remove();
  msg(`Готово: ${ext.toUpperCase()}, 1920×1080, ${D} с, ${(blob.size/1048576).toFixed(1)} МБ. <a href="${lastURL}" download="${name}">Скачать ещё раз</a>`,true);
  recording=false;updateUI()};
 setTheme(THI);regen();recording=true;recEnd=T+D;rec.start(500);updateUI();msg('Идёт запись. Не переключай вкладку, пока она не закончится.')}
function tickRec(){if(!recording)return;const left=Math.max(0,recEnd-T);$('dl').textContent='Запись… '+Math.ceil(left)+' с';if(left<=0&&rec.state==='recording'){rec.stop();$('dl').textContent='Сохраняю…'}}

/* ---------- интерфейс ---------- */
const txt=$('txt'),stage=$('stage');let touched=false;
function msg(s,html){const m=$('msg');if(html)m.innerHTML=s;else m.textContent=s}
function updateUI(){$('hint').style.opacity=(!touched||!curText.trim())&&!recording?1:0;$('badge').style.display=recording?'block':'none';
 ['again','clear','txt'].forEach(id=>$(id).disabled=recording);document.querySelectorAll('.seg button,.chip').forEach(b=>b.disabled=recording);
 $('dl').disabled=recording||!letters.length;if(!recording)$('dl').textContent='Скачать видео'}
stage.addEventListener('click',()=>{if(!recording)txt.focus()});
txt.addEventListener('focus',()=>{if(!touched){touched=true;setTimeout(()=>txt.select(),0);updateUI()}});
txt.addEventListener('input',()=>{touched=true;setText(txt.value)});
txt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();txt.blur()}});
document.addEventListener('keydown',e=>{if(recording||document.activeElement===txt||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key.length===1&&!(document.activeElement&&document.activeElement.tagName==='BUTTON'&&e.key===' '))txt.focus()});
$('dur').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||recording)return;D=+b.dataset.d;document.querySelectorAll('#dur button').forEach(x=>x.classList.toggle('on',x===b))});
$('again').onclick=()=>{if(letters.length)regen()};
$('clear').onclick=()=>{txt.value='';letters=[];curText='';resetScene();updateUI();txt.focus()};
$('dl').onclick=startRecording;

let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T=now/1000;const k=1-Math.exp(-dt*9);
 for(const L of letters){L.x+=(L.tx-L.x)*k;L.y+=(L.ty-L.y)*k;L.sc+=(L.tsc-L.sc)*k}
 render();tickRec();requestAnimationFrame(frame)}
function boot(){T=performance.now()/1000;setTheme(0);resetScene();txt.value='Цветы';setText('Цветы');regen();updateUI();requestAnimationFrame(frame)}
const fontsReady=document.fonts?Promise.all([document.fonts.load(FONT,'Ж'),document.fonts.load(FONT,'a')]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(boot,boot);
window.__fl={setTheme,setText:s=>{txt.value=s;setText(s)},regen,startRecording,get T(){return T},get letters(){return letters}};
})();
</script>
